name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XiaoleiDLAN-Setup-1.0.0.exe
          name: Xiaolei DLAN ${{ github.ref_name }}
          body: |
            Xiaolei DLAN ${{ github.ref_name }} 正式发布。

            ### 安装包
            - `XiaoleiDLAN-Setup-1.0.0.exe`：Windows 64 位安装包，内置 mpv 播放器。

            ### 主要更新
            - 仓库结构整理，仅保留 Windows 接收端代码。
            - 设备名称与 DLNA 端口支持自动保存（settings.json）。
            - 内存日志增加上限保护，防止长时间运行占用过多内存。
            - 安装包图标修复为多尺寸 ICO，安装向导改为简体中文。
          generate_release_notes: false
